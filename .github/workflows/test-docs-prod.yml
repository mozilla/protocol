name: Test publish docs (temporary)

on:
  push:
    branches: [test-checkout-v7]

permissions:
  contents: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push demo1
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git push origin ${GITHUB_SHA}:demo1
